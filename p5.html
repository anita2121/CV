<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV & Object Optimization Studio</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- OpenCV.js (Loaded asynchronously) -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-600/30">
                    <i class="fa-solid fa-microchip text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">OpenCV & CV Studio Pro</h1>
                    <p class="text-xs text-slate-400" id="opencvStatus">Memuat pustaka OpenCV.js...</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="toggleCameraBtn" onclick="toggleCamera()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-emerald-600/20 flex items-center gap-2">
                    <i class="fa-solid fa-video" id="camIcon"></i> <span id="camBtnText">Aktifkan Kamera</span>
                </button>
                <label class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer flex items-center gap-2">
                    <i class="fa-solid fa-upload"></i> Unggah Gambar
                    <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- Left 3 Columns: Viewport & Canvas Area -->
        <section class="lg:col-span-3 flex flex-col gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col items-center justify-center relative min-h-[400px] md:min-h-[550px] overflow-hidden">
                
                <video id="webcamVideo" autoplay playsinline class="hidden"></video>
                
                <div class="relative w-full h-full flex items-center justify-center overflow-auto max-h-[70vh]">
                    <canvas id="outputCanvas" class="max-w-full max-h-[65vh] object-contain rounded-lg shadow-2xl border border-slate-700/50 bg-black/40"></canvas>
                </div>

                <!-- Live Status Badge -->
                <div id="statusBadge" class="absolute top-6 left-6 bg-black/60 backdrop-blur px-3 py-1.5 rounded-full text-xs font-medium border border-white/10 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse" id="statusDot"></span>
                    <span id="statusText">Kamera Mati / Belum Ada Gambar</span>
                </div>

                <!-- Floating Quick Actions -->
                <div class="absolute bottom-6 flex flex-wrap justify-center gap-3 bg-black/60 backdrop-blur px-4 py-2 rounded-2xl border border-white/10 shadow-2xl">
                    <button onclick="captureSnapshot()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2 shadow-md">
                        <i class="fa-solid fa-camera"></i> Ambil Foto (Freeze)
                    </button>
                    <button onclick="resetAllEffects()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i> Reset Efek
                    </button>
                    <button onclick="downloadImage()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2 shadow-md">
                        <i class="fa-solid fa-download"></i> Unduh Hasil
                    </button>
                </div>
            </div>
        </section>

        <!-- Right 1 Column: Controls Panel -->
        <aside class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-6 overflow-y-auto max-h-[80vh] lg:max-h-[calc(100vh-140px)]">
            
            <!-- Filter & Optimization Section -->
            <div>
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-blue-500"></i> Filter & Optimasi CV
                </h3>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <button onclick="setFilter('normal')" id="btn-normal" class="filter-btn bg-slate-800 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition ring-2 ring-blue-500">Normal</button>
                    <button onclick="setFilter('grayscale')" id="btn-grayscale" class="filter-btn bg-slate-800/50 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition">Grayscale</button>
                    <button onclick="setFilter('bw')" id="btn-bw" class="filter-btn bg-slate-800/50 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition">Threshold B&W</button>
                    <button onclick="setFilter('bokeh')" id="btn-bokeh" class="filter-btn bg-slate-800/50 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition">Bokeh Blur</button>
                    <button onclick="setFilter('gradient_edge')" id="btn-gradient_edge" class="filter-btn bg-slate-800/50 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition">Edge Gradient</button>
                    <button onclick="setFilter('noise_reduction')" id="btn-noise_reduction" class="filter-btn bg-slate-800/50 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition">Denoise</button>
                </div>

                <!-- Sliders -->
                <div id="bwSliderContainer" class="hidden space-y-2 mt-3 pt-3 border-t border-slate-800">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Threshold Value</span>
                        <span id="bwThresholdVal">128</span>
                    </div>
                    <input type="range" id="bwThresholdRange" min="0" max="255" value="128" oninput="updateParam('bwThreshold', this.value)" class="w-full accent-blue-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
                </div>

                <div id="bokehSliderContainer" class="hidden space-y-2 mt-3 pt-3 border-t border-slate-800">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Intensitas Bokeh</span>
                        <span id="bokehBlurVal">10</span>
                    </div>
                    <input type="range" id="bokehBlurRange" min="1" max="30" value="10" oninput="updateParam('bokehBlur', this.value)" class="w-full accent-blue-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
                </div>

                <div id="gradientSliderContainer" class="hidden space-y-2 mt-3 pt-3 border-t border-slate-800">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Sensitivitas Edge</span>
                        <span id="gradientSensVal">1.0</span>
                    </div>
                    <input type="range" id="gradientSensRange" min="0.5" max="3.0" step="0.1" value="1.0" oninput="updateParam('gradientSens', this.value)" class="w-full accent-blue-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
                </div>

                <div id="noiseSliderContainer" class="hidden space-y-2 mt-3 pt-3 border-t border-slate-800">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Level Denoise</span>
                        <span id="noiseLevelVal">1</span>
                    </div>
                    <input type="range" id="noiseLevelRange" min="1" max="5" step="1" value="1" oninput="updateParam('noiseLevel', this.value)" class="w-full accent-blue-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
                </div>
            </div>

            <!-- Morphological Operations Section -->
            <div class="pt-4 border-t border-slate-800">
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-project-diagram text-blue-500"></i> Operasi Morfologi
                </h3>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="applyMorphology('dilation')" id="btn-dilation" class="morph-btn bg-slate-800 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-expand"></i> Dilasi
                    </button>
                    <button onclick="applyMorphology('erosion')" id="btn-erosion" class="morph-btn bg-slate-800 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-compress"></i> Erosi
                    </button>
                    <button onclick="applyMorphology('opening')" id="btn-opening" class="morph-btn bg-slate-800 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-sun"></i> Opening
                    </button>
                    <button onclick="applyMorphology('closing')" id="btn-closing" class="morph-btn bg-slate-800 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-moon"></i> Closing
                    </button>
                </div>
            </div>

            <!-- Noise Generator -->
            <div class="pt-4 border-t border-slate-800">
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-blue-500"></i> Generator Noise (Random)
                </h3>
                <div class="space-y-2">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Intensitas Noise</span>
                        <span id="noiseIntensityVal">0%</span>
                    </div>
                    <input type="range" id="noiseIntensityRange" min="0" max="100" value="0" oninput="updateNoiseIntensity(this.value)" class="w-full accent-blue-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
                </div>
            </div>

            <!-- Geometric Transformations -->
            <div class="pt-4 border-t border-slate-800">
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-shapes text-blue-500"></i> Transformasi Geometrik
                </h3>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="rotateImage(90)" class="bg-slate-800 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-rotate-right"></i> Putar 90°
                    </button>
                    <button onclick="rotateImage(180)" class="bg-slate-800 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-arrows-rotate"></i> Putar 180°
                    </button>
                    <button onclick="flipImage('h')" class="bg-slate-800 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-arrows-left-right"></i> Flip Horisontal
                    </button>
                    <button onclick="flipImage('v')" class="bg-slate-800 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-arrows-up-down"></i> Flip Vertikal
                    </button>
                </div>
            </div>

        </aside>
    </main>

    <!-- Modal Notifikasi -->
    <div id="notificationModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
            <h4 id="modalTitle" class="text-lg font-bold">Informasi</h4>
            <p id="modalMessage" class="text-sm text-slate-300">Pesan...</p>
            <button onclick="closeModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-sm font-medium transition">Tutup</button>
        </div>
    </div>

    <!-- Script Aplikasi -->
    <script>
        const video = document.getElementById('webcamVideo');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');

        let isCameraActive = false;
        let animationFrameId = null;
        let currentImage = null;
        let opencvReady = false;

        let currentFilter = 'normal';
        let bwThreshold = 128;
        let bokehBlur = 10;
        let gradientSens = 1.0;
        let noiseLevel = 1;
        let morphologyType = 'none';
        let noiseIntensity = 0;
        let rotationAngle = 0;
        let flipH = false;
        let flipV = false;
        let originalAspectRatio = 1;

        function onOpenCvReady() {
            opencvReady = true;
            document.getElementById('opencvStatus').textContent = "OpenCV.js Siap Digunakan (Haar Cascade Optimized)";
        }

        window.onload = function() {
            drawPlaceholder();
        };

        function drawPlaceholder() {
            canvas.width = 640;
            canvas.height = 480;
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#64748b';
            ctx.font = '16px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Aktifkan Kamera atau Unggah Gambar untuk Memulai', canvas.width / 2, canvas.height / 2);
        }

        async function toggleCamera() {
            if (!isCameraActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
                    video.srcObject = stream;
                    await video.play();
                    isCameraActive = true;
                    currentImage = null;

                    document.getElementById('camIcon').className = "fa-solid fa-video-slash";
                    document.getElementById('camBtnText').textContent = "Matikan Kamera";
                    document.getElementById('statusDot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                    document.getElementById('statusText').textContent = "Kamera Aktif (Live CV)";

                    startRealtimeProcessing();
                } catch (err) {
                    showModal("Gagal Mengakses Kamera", "Periksa izin perangkat Anda.", "error");
                }
            } else {
                stopCamera();
            }
        }

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            isCameraActive = false;
            cancelAnimationFrame(animationFrameId);
            document.getElementById('camIcon').className = "fa-solid fa-video";
            document.getElementById('camBtnText').textContent = "Aktifkan Kamera";
            document.getElementById('statusDot').className = "w-2.5 h-2.5 rounded-full bg-rose-500";
            document.getElementById('statusText').textContent = "Kamera Mati";
            drawPlaceholder();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                if (isCameraActive) stopCamera();
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        currentImage = img;
                        rotationAngle = 0;
                        flipH = false;
                        flipV = false;
                        canvas.width = img.width;
                        canvas.height = img.height;
                        originalAspectRatio = img.width / img.height;
                        processAndDrawImage(img);
                        document.getElementById('statusDot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
                        document.getElementById('statusText').textContent = `Gambar Dimuat (${img.width}x${img.height}px)`;
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function startRealtimeProcessing() {
            function processLoop() {
                if (!isCameraActive) return;
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        originalAspectRatio = canvas.width / canvas.height;
                    }
                    processAndDrawImage(video);
                }
                animationFrameId = requestAnimationFrame(processLoop);
            }
            processLoop();
        }

        function captureSnapshot() {
            if (!isCameraActive && !currentImage) {
                showModal("Peringatan", "Tidak ada sumber video aktif.", "warning");
                return;
            }
            if (isCameraActive) {
                isCameraActive = false;
                cancelAnimationFrame(animationFrameId);
                const img = new Image();
                img.src = canvas.toDataURL('image/png');
                img.onload = function() { currentImage = img; };
                document.getElementById('camIcon').className = "fa-solid fa-video";
                document.getElementById('camBtnText').textContent = "Aktifkan Kamera";
                document.getElementById('statusDot').className = "w-2.5 h-2.5 rounded-full bg-amber-500";
                document.getElementById('statusText').textContent = "Foto Dijepret (Freeze)";
            }
        }

        function processAndDrawImage(source) {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            let w = source.videoWidth || source.width;
            let h = source.videoHeight || source.height;

            if (rotationAngle === 90 || rotationAngle === 270) {
                tempCanvas.width = h; tempCanvas.height = w;
            } else {
                tempCanvas.width = w; tempCanvas.height = h;
            }

            tempCtx.save();
            tempCtx.translate(tempCanvas.width / 2, tempCanvas.height / 2);
            tempCtx.rotate((rotationAngle * Math.PI) / 180);
            tempCtx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
            tempCtx.drawImage(source, -w / 2, -h / 2, w, h);
            tempCtx.restore();

            const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            applySelectedFilter(imgData, tempCanvas.width, tempCanvas.height);
            tempCtx.putImageData(imgData, 0, 0);

            canvas.width = tempCanvas.width;
            canvas.height = tempCanvas.height;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(tempCanvas, 0, 0);
        }

        function applySelectedFilter(imgData, width, height) {
            const data = imgData.data;
            const len = data.length;

            if (currentFilter === 'grayscale') {
                for (let i = 0; i < len; i += 4) {
                    let avg = 0.3 * data[i] + 0.59 * data[i + 1] + 0.11 * data[i + 2];
                    data[i] = avg; data[i + 1] = avg; data[i + 2] = avg;
                }
            } else if (currentFilter === 'bw') {
                for (let i = 0; i < len; i += 4) {
                    let avg = 0.3 * data[i] + 0.59 * data[i + 1] + 0.11 * data[i + 2];
                    let val = avg >= parseInt(bwThreshold) ? 255 : 0;
                    data[i] = val; data[i + 1] = val; data[i + 2] = val;
                }
            } else if (currentFilter === 'bokeh') {
                applyRadialBokeh(imgData, width, height, parseInt(bokehBlur));
            } else if (currentFilter === 'gradient_edge') {
                applyGradientEdge(imgData, width, height, parseFloat(gradientSens));
            } else if (currentFilter === 'noise_reduction') {
                applyDenoiseFilter(imgData, width, height, parseInt(noiseLevel));
            }

            if (morphologyType !== 'none') {
                applyRealtimeMorphology(imgData, width, height, morphologyType);
            }

            if (noiseIntensity > 0) {
                applyRandomNoise(imgData, noiseIntensity);
            }
        }

        // --- Algoritma Pendukung CV & Optimasi Haar Cascade ---
        function applyGradientEdge(imgData, width, height, sensitivity) {
            const data = imgData.data;
            const grayscale = new Float32Array(width * height);
            for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                grayscale[p] = 0.3 * data[i] + 0.59 * data[i + 1] + 0.11 * data[i + 2];
            }
            const copy = new Float32Array(grayscale);
            const kX = [[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]];
            const kY = [[-1, -2, -1], [0, 0, 0], [1, 2, 1]];
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    let pixelX = 0, pixelY = 0;
                    for (let ky = -1; ky <= 1; ky++) {
                        for (let kx = -1; kx <= 1; kx++) {
                            let val = copy[(y + ky) * width + (x + kx)];
                            pixelX += val * kX[ky + 1][kx + 1];
                            pixelY += val * kY[ky + 1][kx + 1];
                        }
                    }
                    let mag = Math.min(255, Math.sqrt(pixelX * pixelX + pixelY * pixelY) * sensitivity);
                    let i = (y * width + x) * 4;
                    data[i] = mag * 1.2; data[i + 1] = mag * 0.8 + 50; data[i + 2] = 255 - mag;
                }
            }
        }

        function applyDenoiseFilter(imgData, width, height, level) {
            const data = imgData.data;
            const copy = new Uint8ClampedArray(data);
            const radius = level;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let rSum = 0, gSum = 0, bSum = 0, count = 0;
                    for (let dy = -radius; dy <= radius; dy++) {
                        let ny = y + dy;
                        if (ny >= 0 && ny < height) {
                            for (let dx = -radius; dx <= radius; dx++) {
                                let nx = x + dx;
                                if (nx >= 0 && nx < width) {
                                    let idx = (ny * width + nx) * 4;
                                    rSum += copy[idx]; gSum += copy[idx + 1]; bSum += copy[idx + 2];
                                    count++;
                                }
                            }
                        }
                    }
                    let i = (y * width + x) * 4;
                    data[i] = rSum / count; data[i + 1] = gSum / count; data[i + 2] = bSum / count;
                }
            }
        }

        function performErosion(input, width, height) {
            const output = new Uint8ClampedArray(input);
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    let minVal = 255;
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            let val = input[(y + dy) * width + (x + dx)];
                            if (val < minVal) minVal = val;
                        }
                    }
                    output[y * width + x] = minVal;
                }
            }
            return output;
        }

        function performDilation(input, width, height) {
            const output = new Uint8ClampedArray(input);
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    let maxVal = 0;
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            let val = input[(y + dy) * width + (x + dx)];
                            if (val > maxVal) maxVal = val;
                        }
                    }
                    output[y * width + x] = maxVal;
                }
            }
            return output;
        }

        function applyRealtimeMorphology(imgData, width, height, type) {
            const data = imgData.data;
            const binary = new Uint8ClampedArray(width * height);
            for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                let avg = 0.3 * data[i] + 0.59 * data[i + 1] + 0.11 * data[i + 2];
                binary[p] = avg > 128 ? 255 : 0;
            }
            let res;
            if (type === 'dilation') res = performDilation(binary, width, height);
            else if (type === 'erosion') res = performErosion(binary, width, height);
            else if (type === 'opening') res = performDilation(performErosion(binary, width, height), width, height);
            else if (type === 'closing') res = performErosion(performDilation(binary, width, height), width, height);
            else res = binary;

            for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                let v = res[p];
                data[i] = v; data[i + 1] = v; data[i + 2] = v;
            }
        }

        function applyMorphology(type) {
            if (!currentImage && !isCameraActive) {
                showModal("Peringatan", "Aktifkan kamera atau unggah gambar.", "warning");
                return;
            }
            morphologyType = (morphologyType === type) ? 'none' : type;
            document.querySelectorAll('.morph-btn').forEach(b => b.classList.remove('bg-blue-600'));
            if (morphologyType !== 'none') {
                document.getElementById(`btn-${type}`).classList.add('bg-blue-600');
            }
            if (!isCameraActive && currentImage) processAndDrawImage(currentImage);
        }

        function applyRandomNoise(imgData, intensity) {
            const data = imgData.data;
            const factor = intensity / 100;
            for (let i = 0; i < data.length; i += 4) {
                if (Math.random() < factor * 0.5) {
                    let v = Math.random() < 0.5 ? 0 : 255;
                    data[i] = v; data[i + 1] = v; data[i + 2] = v;
                }
            }
        }

        function updateNoiseIntensity(val) {
            noiseIntensity = parseInt(val);
            document.getElementById('noiseIntensityVal').textContent = val + '%';
            if (!isCameraActive && currentImage) processAndDrawImage(currentImage);
        }

        function applyRadialBokeh(imgData, width, height, blurRadius) {
            const data = imgData.data;
            const copy = new Uint8ClampedArray(data);
            const cx = width / 2, cy = height / 2;
            const maxDist = Math.sqrt(cx * cx + cy * cy);
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let idx = (y * width + x) * 4;
                    let dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
                    let factor = dist / maxDist;
                    if (factor > 0.35) {
                        let r = 0, g = 0, b = 0, cnt = 0;
                        let dBlur = Math.floor(blurRadius * factor);
                        for (let dy = -dBlur; dy <= dBlur; dy += 2) {
                            let ny = y + dy;
                            if (ny >= 0 && ny < height) {
                                for (let dx = -dBlur; dx <= dBlur; dx += 2) {
                                    let nx = x + dx;
                                    if (nx >= 0 && nx < width) {
                                        let ni = (ny * width + nx) * 4;
                                        r += copy[ni]; g += copy[ni + 1]; b += copy[ni + 2];
                                        cnt++;
                                    }
                                }
                            }
                        }
                        if (cnt > 0) {
                            data[idx] = r / cnt; data[idx + 1] = g / cnt; data[idx + 2] = b / cnt;
                        }
                    }
                }
            }
        }

        function setFilter(filterName) {
            currentFilter = filterName;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('ring-2', 'ring-blue-500', 'bg-slate-800'));
            document.getElementById(`btn-${filterName}`).classList.add('ring-2', 'ring-blue-500');

            document.getElementById('bwSliderContainer').classList.toggle('hidden', filterName !== 'bw');
            document.getElementById('bokehSliderContainer').classList.toggle('hidden', filterName !== 'bokeh');
            document.getElementById('gradientSliderContainer').classList.toggle('hidden', filterName !== 'gradient_edge');
            document.getElementById('noiseSliderContainer').classList.toggle('hidden', filterName !== 'noise_reduction');

            if (!isCameraActive && currentImage) processAndDrawImage(currentImage);
        }

        function updateParam(param, val) {
            if (param === 'bwThreshold') { bwThreshold = val; document.getElementById('bwThresholdVal').textContent = val; }
            else if (param === 'bokehBlur') { bokehBlur = val; document.getElementById('bokehBlurVal').textContent = val; }
            else if (param === 'gradientSens') { gradientSens = val; document.getElementById('gradientSensVal').textContent = val; }
            else if (param === 'noiseLevel') { noiseLevel = val; document.getElementById('noiseLevelVal').textContent = val; }
            if (!isCameraActive && currentImage) processAndDrawImage(currentImage);
        }

        function rotateImage(angle) {
            rotationAngle = (rotationAngle + angle) % 360;
            if (!isCameraActive && currentImage) processAndDrawImage(currentImage);
        }

        function flipImage(dir) {
            if (dir === 'h') flipH = !flipH;
            if (dir === 'v') flipV = !flipV;
            if (!isCameraActive && currentImage) processAndDrawImage(currentImage);
        }

        function resetAllEffects() {
            currentFilter = 'normal';
            morphologyType = 'none';
            noiseIntensity = 0;
            document.getElementById('noiseIntensityRange').value = 0;
            document.getElementById('noiseIntensityVal').textContent = '0%';
            rotationAngle = 0; flipH = false; flipV = false;
            setFilter('normal');
            document.querySelectorAll('.morph-btn').forEach(b => b.classList.remove('bg-blue-600'));
            if (currentImage) processAndDrawImage(currentImage);
            else drawPlaceholder();
            showModal("Reset", "Semua efek diatur ulang.", "info");
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = `opencv-processed-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function showModal(title, message) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('notificationModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('notificationModal').classList.add('hidden');
        }
    </script>
</body>
</html>
